<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AGY Claude Style Studio</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--background, #161618);
      --fg: var(--foreground, #ececef);
      --muted-fg: var(--muted-foreground, #9a9aa6);
      --card-bg: var(--card, rgba(255, 255, 255, 0.04));
      --border-col: var(--border, rgba(255, 255, 255, 0.12));
      --control-bg: rgba(255, 255, 255, 0.05);
      --badge-bg: #1b1918;
      --accent: #d97757;
      --accent-soft: rgba(217, 119, 87, 0.16);
      --ok: #3fb950;
      --warn: #d29922;
      --warn-bg: rgba(210, 153, 34, 0.14);
      --warn-border: rgba(210, 153, 34, 0.45);
      --toast-bg: rgba(27, 25, 24, 0.94);
      --toast-fg: #f4f4f6;
      --radius: 10px;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: var(--background, #f6f6f7);
        --fg: var(--foreground, #1a1b1e);
        --muted-fg: var(--muted-foreground, #61646b);
        --card-bg: var(--card, #ffffff);
        --border-col: var(--border, rgba(0, 0, 0, 0.11));
        --control-bg: #ffffff;
        --badge-bg: rgba(217, 119, 87, 0.14);
        --warn-bg: rgba(210, 153, 34, 0.12);
        --toast-bg: rgba(26, 27, 30, 0.94);
        --toast-fg: #ffffff;
      }
    }
    :root[data-theme="light"] {
      --bg: var(--background, #f6f6f7);
      --fg: var(--foreground, #1a1b1e);
      --muted-fg: var(--muted-foreground, #61646b);
      --card-bg: var(--card, #ffffff);
      --border-col: var(--border, rgba(0, 0, 0, 0.11));
      --control-bg: #ffffff;
      --badge-bg: rgba(217, 119, 87, 0.14);
      --warn-bg: rgba(210, 153, 34, 0.12);
      --toast-bg: rgba(26, 27, 30, 0.94);
      --toast-fg: #ffffff;
    }
    :root[data-theme="dark"] {
      --bg: var(--background, #161618);
      --fg: var(--foreground, #ececef);
      --muted-fg: var(--muted-foreground, #9a9aa6);
      --card-bg: var(--card, rgba(255, 255, 255, 0.04));
      --border-col: var(--border, rgba(255, 255, 255, 0.12));
      --control-bg: #1e1f23;
      --badge-bg: #1b1918;
      --warn-bg: rgba(210, 153, 34, 0.14);
      --toast-bg: rgba(27, 25, 24, 0.94);
      --toast-fg: #f4f4f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-col);
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--badge-bg, #1b1918);
      border: 1.5px solid var(--accent);
      display: grid;
      place-items: center;
      font-size: 16px;
      flex: 0 0 auto;
    }
    .brand-title {
      font-weight: 600;
      font-size: 14px;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--muted-fg);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid var(--border-col);
      background: var(--card-bg);
      white-space: nowrap;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); }
    .banner {
      display: none;
      padding: 9px 11px;
      border-radius: 9px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      font-size: 12px;
      margin-bottom: 12px;
    }
    .banner.show { display: block; }
    .banner-title { font-weight: 600; margin-bottom: 2px; }
    .banner-desc { font-size: 11.5px; color: var(--muted-fg); }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      appearance: none;
      border: 1px solid var(--border-col);
      background: var(--card-bg);
      color: var(--fg);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    button:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover {
      filter: brightness(1.06);
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .section {
      background: var(--card-bg);
      border: 1px solid var(--border-col);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted-fg);
      letter-spacing: 0.02em;
      margin: 0 0 8px 0;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid rgba(128, 128, 128, 0.12);
    }
    .row:first-of-type { border-top: none; }
    .row.is-dimmed {
      opacity: 0.52;
      transition: opacity 120ms ease;
    }
    .row-label {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      flex: 1;
    }
    .row-name { font-weight: 500; }
    .row-desc { font-size: 11px; color: var(--muted-fg); }
    select {
      background: var(--control-bg);
      color: var(--fg);
      border: 1px solid var(--border-col);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 12px;
      min-width: 122px;
      flex-shrink: 0;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .toast {
      position: sticky;
      bottom: 8px;
      margin-top: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      background: var(--toast-bg);
      color: var(--toast-fg);
      border: 1px solid var(--accent);
      font-size: 12px;
      display: none;
    }
    .toast.show { display: block; }
  </style>
</head>

    <div class="status-pill" id="status-pill">

    <div class="actions" style="margin:8px 0 0">

          placeholderStyle: ['入力欄プレースホルダー', 'Studio の案内文または標準文言を選択', [['studio', 'スタジオ'], ['host', '標準']]],
          effortSliderStyle: ['推論スライダースタイル', '推論レベルクリック時に開くスライダー', [['claude', 'Claude Code'], ['chatgpt', 'ChatGPT Codex'], ['liangwufeng', '梁武峰']]],
          effortAccent: ['Claude 推論カラー強調', 'Claude モードで青紫グラデーションを使用'],
          performanceBackdrop: ['梁武峰 ポートレート背景', '31 フレーム背景の表示位置', [['card', 'カード内'], ['page', 'ウィンドウ全体'], ['off', 'オフ']]],
          smoothCaret: ['スムーズ入力カーソル', '入力カーソル移動の補間アニメーション'],
          mascot: ['ピクセルカニ Clawd', '19 種のアニメーションで状態に反応', [['crab', 'オン'], ['off', 'オフ']]],
          homeRipple: ['ホーム文字リップル', 'ホーム背景クリックで文字グリッドの波紋を再生'],

    const GROUP_DEFS = [
      { id: 'appearance', titleKey: 'grpAppearance', keys: ['language', 'homeLayout', 'palette', 'logoInk', 'sidebarRestyle', 'sidebarCompact', 'composerRestyle', 'placeholderStyle'] },
      { id: 'interaction', titleKey: 'grpInteraction', keys: ['effortSliderStyle', 'effortAccent', 'performanceBackdrop', 'smoothCaret', 'mascot', 'homeRipple'] },
    ];

    const apiFetch = (url, opts) => {
      if (window.sidecar && typeof window.sidecar.fetch === 'function') {
        return window.sidecar.fetch(url, opts);
      }
      return fetch(url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts && opts.headers) }
      });
    };

    let currentConfig = { language: 'zh-CN' };
    let lastStatus = null;
    let toastTimer = null;

    function getT() {
      const lang = currentConfig?.language;
      return TEXTS[lang] || TEXTS['zh-CN'];
    }

    function parseColorLuminance(raw) {
      const s = String(raw || '').trim();
      if (!s) return null;
      let r, g, b;
      const hex = s.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (hex) {
        const h = hex[1];
        if (h.length === 3) {
          r = parseInt(h[0] + h[0], 16);
          g = parseInt(h[1] + h[1], 16);
          b = parseInt(h[2] + h[2], 16);
        } else {
          r = parseInt(h.slice(0, 2), 16);
          g = parseInt(h.slice(2, 4), 16);
          b = parseInt(h.slice(4, 6), 16);
        }
        return 0.299 * r + 0.587 * g + 0.114 * b;
      }
      const rgb = s.match(/^rgba?\(\s*([\d.]+)\s*[,\s]\s*([\d.]+)\s*[,\s]\s*([\d.]+)(?:\s*[,/]\s*([\d.]+))?\s*\)$/i);
      if (rgb) {
        if (rgb[4] !== undefined && Number(rgb[4]) === 0) return null;
        return 0.299 * Number(rgb[1]) + 0.587 * Number(rgb[2]) + 0.114 * Number(rgb[3]);
      }
      return null;
    }

    function syncHostThemeAttr(overrideBg) {
      const candidates = [
        overrideBg,
        getComputedStyle(document.documentElement).getPropertyValue('--background'),
        document.body ? getComputedStyle(document.body).backgroundColor : '',
      ];
      for (const cand of candidates) {
        const lum = parseColorLuminance(cand);
        if (lum !== null) {
          document.documentElement.setAttribute('data-theme', lum < 140 ? 'dark' : 'light');
          return;
        }
      }
      const bCls = document.body?.className || '';
      const hCls = document.documentElement?.className || '';
      if (/\btheme-light\b|\blight-theme\b/i.test(bCls + ' ' + hCls)) {
        document.documentElement.setAttribute('data-theme', 'light');
        return;
      }
      if (/\btheme-dark\b|\bdark-theme\b/i.test(bCls + ' ' + hCls)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        return;
      }
      if (typeof window.matchMedia === 'function') {
        const isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function renderStaticChrome() {
      const t = getT();
      document.documentElement.lang = currentConfig?.language === 'yue' ? 'zh-HK' : (currentConfig?.language || 'zh-CN');
      document.getElementById('btn-reinject').textContent = t.btnReinject;
      document.getElementById('btn-remove').textContent = t.btnRemove;
      document.getElementById('btn-reset').textContent = t.btnReset;
      document.getElementById('btn-refresh').textContent = t.btnRefresh;
      document.getElementById('btn-relaunch').textContent = t.btnRelaunch;
      document.getElementById('cdp-banner-title').textContent = t.cdpTitle;
      const isMacSigned = lastStatus?.launcher?.reason === 'macos_app_bundle_signed';
      document.getElementById('cdp-banner-desc').textContent = isMacSigned ? t.cdpDescMac : t.cdpDesc;
      const metaBanner = document.getElementById('cdp-banner-meta');
      const relaunchBtn = document.getElementById('btn-relaunch');
      if (lastStatus) {
        const st = lastStatus;
        const dot = document.getElementById('status-dot');
        const txt = document.getElementById('status-text');
        const meta = document.getElementById('meta-line');
        const hasCdp = st.cdp && st.cdp.port && st.cdp.pageCount > 0;
        dot.classList.toggle('ok', Boolean(hasCdp));
        txt.textContent = hasCdp
          ? t.connected(st.cdp.port, st.cdp.pageCount)
          : st.watcher?.alive ? t.waitingPort : t.disconnected;
        meta.textContent = `v${st.version || '1.0.0'} · ${st.watcher?.alive ? t.watcherOn(st.watcher.pid) : t.watcherOff}`;
        const showBanner = Boolean(st.cdp?.needsCdpRestart);
        document.getElementById('cdp-banner').classList.toggle('show', showBanner);
        if (metaBanner) {
          if (showBanner && st.launcher?.checked && !isMacSigned) {
            const cnt = Number(st.launcher.configuredCount || 0);
            metaBanner.textContent = cnt > 0 ? t.launcherReady(cnt) : t.launcherPending;
            metaBanner.style.display = 'block';
          } else {
            metaBanner.textContent = '';
            metaBanner.style.display = 'none';
          }
        }
        if (relaunchBtn) {
          relaunchBtn.style.display = st.cdp?.canRelaunch === false ? 'none' : '';
        }
      } else {
        document.getElementById('meta-line').textContent = t.loading;
        document.getElementById('status-text').textContent = t.checking;
        if (metaBanner) metaBanner.style.display = 'none';
      }
    }

    function renderForm(cfg) {
      const t = getT();
      const container = document.getElementById('sections');
      container.innerHTML = '';
      for (const group of GROUP_DEFS) {
        const sec = document.createElement('div');
        sec.className = 'section';
        const h = document.createElement('div');
        h.className = 'section-title';
        h.textContent = t[group.titleKey];
        sec.appendChild(h);

        for (const key of group.keys) {
          const itemDef = t.items[key];
          if (!itemDef) continue;
          const [labelText, descText, options] = itemDef;
          const row = document.createElement('div');
          row.className = 'row';
          row.setAttribute('data-row-key', key);
          if (key === 'effortAccent' && cfg.effortSliderStyle !== 'claude') {
            row.classList.add('is-dimmed');
          }
          if (key === 'performanceBackdrop' && cfg.effortSliderStyle !== 'liangwufeng') {
            row.classList.add('is-dimmed');
          }

          const label = document.createElement('div');
          label.className = 'row-label';
          const name = document.createElement('div');
          name.className = 'row-name';
          name.textContent = labelText;
          const desc = document.createElement('div');
          desc.className = 'row-desc';
          desc.textContent = descText;
          label.appendChild(name);
          label.appendChild(desc);
          row.appendChild(label);

          if (!options) {
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = Boolean(cfg[key]);
            cb.addEventListener('change', () => saveOne(key, cb.checked));
            row.appendChild(cb);
          } else {
            const sel = document.createElement('select');
            for (const [val, text] of options) {
              const opt = document.createElement('option');
              opt.value = val;
              opt.textContent = text;
              if (cfg[key] === val) opt.selected = true;
              sel.appendChild(opt);
            }
            sel.addEventListener('change', () => saveOne(key, sel.value));
            row.appendChild(sel);
          }
          sec.appendChild(row);
        }
        container.appendChild(sec);
      }
    }

    async function saveOne(key, value) {
      try {
        const res = await apiFetch('/api/config', {
          method: 'POST',
          body: JSON.stringify({ key, value })
        });
        const data = await res.json();
        if (data.config) currentConfig = data.config;
        renderStaticChrome();
        renderForm(currentConfig);
        const t = getT();
        showToast(data.ok ? t.savedToast(key) : t.invalidToast(key));
      } catch (err) {
        showToast(getT().saveErrToast(err.message));
      }
    }

    async function refreshStatus() {
      syncHostThemeAttr();
      try {
        const res = await apiFetch('/api/status', { method: 'GET' });
        const st = await res.json();
        lastStatus = st;
        currentConfig = st.config || currentConfig;
        renderStaticChrome();
        renderForm(currentConfig);
      } catch (err) {
        const t = getT();
        document.getElementById('status-text').textContent = t.readFailed;
        document.getElementById('meta-line').textContent = err.message;
      }
    }

    async function postAction(path, labelKey) {
      const btns = document.querySelectorAll('.actions button');
      btns.forEach((b) => (b.disabled = true));
      try {
        const res = await apiFetch(path, { method: 'POST', body: '{}' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        const t = getT();
        showToast(t.actionOk(t[labelKey]));
        await refreshStatus();
      } catch (err) {
        const t = getT();
        showToast(t.actionFail(t[labelKey], err.message));
      } finally {
        btns.forEach((b) => (b.disabled = false));
      }
    }

    async function triggerRelaunch() {
      const btn = document.getElementById('btn-relaunch');
      if (btn) btn.disabled = true;
      try {
        const res = await apiFetch('/api/relaunch', { method: 'POST', body: '{}' });
        const data = await res.json();
        if (!res.ok || !data?.ok) throw new Error(data?.error || 'Error');
        showToast(getT().relaunching);
      } catch (err) {
        showToast(getT().relaunchFail(err.message));
        if (btn) btn.disabled = false;
      }
    }

    window.addEventListener('message', (ev) => {
      if (ev.data?.type === 'theme-change') {
        const bg = ev.data?.payload?.cssVariables?.['--background'];
        syncHostThemeAttr(bg);
        if (typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(() => syncHostThemeAttr());
        }
      }
    });
    if (typeof window.matchMedia === 'function') {
      try {
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => syncHostThemeAttr());
      } catch {}
    }

    document.getElementById('btn-relaunch').addEventListener('click', triggerRelaunch);
    document.getElementById('btn-reinject').addEventListener('click', () => postAction('/api/reinject', 'btnReinject'));
    document.getElementById('btn-remove').addEventListener('click', () => postAction('/api/remove', 'btnRemove'));
    document.getElementById('btn-reset').addEventListener('click', () => postAction('/api/reset', 'btnReset'));
    document.getElementById('btn-refresh').addEventListener('click', refreshStatus);

    renderStaticChrome();
    refreshStatus();
  </script>
